<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Walkaholic mark: an 85% streak ring around a flame. Source for every icon and the splash
       (npm run android:assets renders the PNGs). The glyph stays inside the Android adaptive-icon
       and PWA maskable safe zones, so launchers may crop the square to any shape. -->
