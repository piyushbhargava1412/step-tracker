    <g transform="scale(1.15)">
      <path d="M0 -26 C10 -12 18 -4 16 10 C14 22 8 26 0 26 C-8 26 -15 21 -16 12 C-17 2 -11 -4 -8 -12 C-6 -4 -3 0 0 2 C-2 -8 -4 -18 0 -26 Z" fill="#f59e0b"/>
      <path d="M0 4 C5 9 8 13 7 18 C6 22 3 24 0 24 C-3 24 -6 22 -6 18 C-6 13 -2 9 0 4 Z" fill="#fcd34d"/>
    </g>
  </g>
</svg>
