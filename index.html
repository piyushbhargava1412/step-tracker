<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step Tracker - Daily Streaks</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="container">
    <header>
        <h1>step-tracker</h1>
        <span id="auth-status">Not connected</span>
        <span id="db-status">Initializing…</span>
        <button id="auth-btn">Connect Google Account</button>
    </header>

    <nav class="tab-bar">
        <button data-tab="dashboard">🏠 Dashboard</button>
        <button data-tab="calendar">📅 Calendar</button>
        <button data-tab="search">🔍 Search Lab</button>
        <button data-tab="spatial">🗺️ Spatial Map</button>
    </nav>

    <main>
        <div id="tab-dashboard"></div>
        <div id="tab-calendar" style="display:none"></div>
        <div id="tab-search" style="display:none"></div>
        <div id="tab-spatial" style="display:none"></div>
    </main>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
